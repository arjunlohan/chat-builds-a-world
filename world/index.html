<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#8babb1">
    <title>The Lantern Garden · Chat Builds a World</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/assets/world.css">
  </head>
  <body class="world-page">
    <div class="world-stage">
      <canvas id="world" width="1920" height="1080" aria-label="A floating lantern garden with coral trees, a spring and a waterfall. Click the island to fly closer."></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <header class="world-heading">
        <span class="world-mark" aria-hidden="true">✳</span>
        <div><p class="world-wordmark">CHAT BUILDS A WORLD</p><p class="world-caption">A little wonder, above it all.</p></div>
      </header>
      <footer class="world-label">
        <p class="world-kicker">A PLACE TO BEGIN</p>
        <h1>The Lantern Garden</h1>
        <p class="world-season"><span class="sun-dot" aria-hidden="true"></span><span id="time-of-day">THE GOLDEN HOURS</span><span class="world-number">WORLD 001</span></p>
      </footer>
      <p class="world-hint">Click somewhere. Stay a while.</p>
      <p id="status" class="world-loading" role="status">Finding a quiet corner of the sky…</p>
      <p id="module-status" class="module-status" role="status" hidden></p>
      <output id="fps" class="fps" aria-label="Frame rate" hidden></output>
    </div>
    <script type="module" src="/assets/world.js"></script>
  </body>
</html>
